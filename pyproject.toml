# -*- coding: utf-8 -*-
# Navette: Weaving the mathematics of light in thin film systems
#
# Copyright (c) 2026 opticsWolf
#
# SPDX-License-Identifier: LGPL-3.0-or-later

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette"
version = "0.4.21"
description = "A high-performance optical engine utilizing a Scattering Matrix algorithm for stable simulation of light in stratified media."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
authors = [
  { name = "opticsWolf", email = "opticswolf@protonmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.22.0",
  "scipy>=1.8.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Single aggregated native extension (navette._navette with all engines).
# Dev install: maturin develop   (from the repo root)
numba = ["numba>=0.56.0"]
dev = ["pytest", "maturin>=1.5,<2.0"]
all = ["numba>=0.56.0", "pytest", "maturin>=1.5,<2.0"]

[project.urls]
Homepage = "https://github.com/opticsWolf/Navette"

[tool.maturin]
# Single-aggregator mixed project: one cdylib (rust/navette-py) with
# native submodules, installed as navette._navette alongside src/navette.
bindings = "pyo3"
manifest-path = "rust/navette-py/Cargo.toml"
python-source = "src"
module-name = "navette._navette"
