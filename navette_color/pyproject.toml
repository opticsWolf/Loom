[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-color"
version = "0.2.0"
description = "Numpy bindings for the Loom color engine (Rust parity port)"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Build the PyO3 extension; without this the bindings are compiled out.
module-name = "navette.color"
features = ["python", "parallel"]
