[package]
name = "navette-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings aggregator: builds navette._navette (all engines, one wheel). Not published; see the navette crate and navette PyPI package."
publish = false

[lib]
name = "_navette"
crate-type = ["cdylib"]

[dependencies]
navette = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312", "num-complex"] }
numpy = { workspace = true }
num-complex = { workspace = true }
ndarray = { workspace = true }
ndarray017 = { package = "ndarray", version = "0.17" }
rand = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = { workspace = true }
ahash = "0.8"
mimalloc = "0.1"
