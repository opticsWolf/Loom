[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-smatrix"
version = "0.3.0"
description = "Fast S-Matrix computations and handling"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Injects the compiled Rust extension into the "navette" namespace 
# under the name "smatrix"
module-name = "navette._smatrix"