[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-spectralweave"
version = "0.2.0"
description = "Fast spectral weaving computations"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Private native extension; public API lives in src/navette/spectralweave/.
python-source = "../../src"
module-name = "navette._spectralweave"
