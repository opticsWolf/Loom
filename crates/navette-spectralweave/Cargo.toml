[package]
name = "navette-spectralweave"
version = "0.3.0"
edition = "2024"
description = "Pure-Rust spectral weaving engine core (no Python). Bindings live in navette-spectralweave-py."
license = "LGPL-3.0-or-later"

[lib]
name = "navette_spectralweave"
crate-type = ["rlib"]

[dependencies]
parking_lot = "0.12"
lru = "0.12"
bytemuck = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"
smallvec = "1.13"
