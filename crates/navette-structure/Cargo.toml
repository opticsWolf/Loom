[package]
name = "navette-structure"
version = "0.3.0"
edition = "2024"
description = "Pure-Rust thin-film stack model: layers, groups, expansion, validation (no Python)."
license = "LGPL-3.0-or-later"
authors = ["opticsWolf"]
repository = "https://github.com/opticsWolf/Navette"

[lib]
name = "navette_structure"
crate-type = ["rlib"]

[dependencies]
navette-materials = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_distr = "0.5"
