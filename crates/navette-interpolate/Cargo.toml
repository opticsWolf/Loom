[package]
name = "navette-interpolate"
version = "0.3.0"
edition = "2024"
authors = ["opticswolf"]
description = "Pure-Rust univariate interpolation core (no Python)."
license.workspace = true
repository.workspace = true

[lib]
name = "navette_interpolate"
crate-type = ["rlib"]

[dependencies]
# Must match numpy 0.28's ndarray (0.17) so core arrays convert to Python.
ndarray = "0.17"
rayon = { workspace = true }
