[package]
name = "navette-interpolate"
version = "0.2.0"
edition = "2024"
authors = ["opticswolf"]
description = "Pure-Rust univariate interpolation core (no Python). Bindings live in navette-interpolate-py."
license = "LGPL-3.0"
repository = "https://github.com/opticswolf/navette-interpolator"

[lib]
name = "navette_interpolate"
crate-type = ["rlib"]

[dependencies]
# Must match numpy 0.28's ndarray (0.17) so core arrays convert to Python.
ndarray = "0.17"
rayon = { workspace = true }
