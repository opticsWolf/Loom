[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-interpolate"
version = "0.2.0"
description = "Fast univariate interpolation with multiple methods and batch support"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Private native extension; public API lives in src/navette/interpolate/.
python-source = "../../src"
module-name = "navette._interpolate"
