[package]
name = "navette-spectralweave-py"
version = "0.2.0"
edition = "2024"
description = "Thin PyO3 bindings exposing navette-spectralweave as navette._spectralweave."
license = "LGPL-3.0-or-later"

[lib]
name = "_spectralweave"
crate-type = ["cdylib"]

[dependencies]
navette-spectralweave = { path = "../navette-spectralweave" }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312"] }
numpy = { workspace = true }
ahash = "0.8"
mimalloc = "0.1"
