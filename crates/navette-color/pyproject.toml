[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-color"
version = "0.2.0"
description = "Numpy bindings for the Navette color engine (Rust parity port)"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Private native extension; public API lives in src/navette/color/.
python-source = "../../src"
module-name = "navette._color"
features = ["python", "parallel"]
