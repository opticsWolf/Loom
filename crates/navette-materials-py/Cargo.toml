[package]
name = "navette-materials-py"
description = "Thin PyO3 bindings exposing navette-materials as navette.materials._native."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
navette-materials = { path = "../navette-materials" }
num-complex = { workspace = true }
ndarray = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py312", "extension-module", "num-complex"] }
numpy = { workspace = true }
