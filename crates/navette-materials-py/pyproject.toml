[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "navette-materials-native"
version = "0.3.0"
description = "Rust kernels for Navette optical dispersion models"
requires-python = ">=3.12"
dependencies = ["numpy>=1.22"]

[tool.maturin]
# Private native extension; public API lives in src/navette/materials/.
manifest-path = "Cargo.toml"
python-source = "../../src"
module-name = "navette.materials._native"
