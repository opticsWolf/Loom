[package]
name = "navette-smatrix-py"
version = "0.3.0"
edition = "2024"
description = "Thin PyO3 bindings exposing navette-smatrix as navette._smatrix."
license = "LGPL-3.0-or-later"

[lib]
name = "_smatrix"
crate-type = ["cdylib"]

[dependencies]
navette-smatrix = { path = "../navette-smatrix" }
pyo3 = { workspace = true, features = ["extension-module", "num-complex"] }
numpy = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
