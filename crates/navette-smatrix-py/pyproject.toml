[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-smatrix"
version = "0.3.0"
description = "Fast S-Matrix computations and handling"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Private native extension; public API lives in src/navette/smatrix/.
python-source = "../../src"
module-name = "navette._smatrix"
