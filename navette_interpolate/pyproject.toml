[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-interpolate"
version = "0.2.0"
description = "Fast univariate interpolation with multiple methods and batch support"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# This tells Maturin to inject the compiled Rust extension 
# into the "navette" namespace under the name "interpolate"
module-name = "navette.interpolate"