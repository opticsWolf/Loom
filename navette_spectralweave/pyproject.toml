[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "navette-spectralweave"
version = "0.2.0"
description = "Fast spectral weaving computations"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
# Injects the compiled Rust extension into the "navette" namespace
# under the name "spectralweave"
module-name = "navette.spectralweave"

[tool.pytest.ini_options]
# Anchor pytest's rootdir/config here so it doesn't pick up a stray
# pytest.ini higher up the tree. Golden + correctness tests live in tests/.
testpaths = ["tests"]
python_files = ["test_*.py"]