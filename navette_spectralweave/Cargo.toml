[package]
name = "navette-spectralweave"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"  # pyo3 0.28.x MSRV

[lib]
name = "spectralweave"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py312"] }
numpy = "0.28"
parking_lot = "0.12"
lru = "0.12"
bytemuck = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mimalloc = "0.1"

# A release profile noticeably improves the Rust benchmark numbers.
# Build with:  maturin develop --release
[profile.release]
opt-level = 3
lto = true
codegen-units = 1