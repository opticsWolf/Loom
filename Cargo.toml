[workspace]
resolver = "2"
members = [
  "rust/navette",
  "rust/navette-py",
]

[workspace.package]
version = "0.4.23"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["opticsWolf"]
repository = "https://github.com/opticsWolf/Navette"

# Shared pins for the Python-facing crates (pure-Rust core may pin older
# toolchains independently).
[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
num-complex = "0.4"
rayon = "1"
ndarray = "0.15"
# Single Rust crate (pure engine + modules); bindings take it by path.
navette = { version = "0.4.23", path = "rust/navette" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
