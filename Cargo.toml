[workspace]
resolver = "2"
members = [
  "crates/navette-color",
  "crates/navette-interpolate",
  "crates/navette-smatrix",
  "crates/navette-spectralweave",
  "crates/navette-materials",
]
# Standalone (own lockfile): pyo3 0.22 predates the 0.28 used above and
# cannot share a resolve (both link `python`). Build it separately:
#   maturin develop -m crates/navette-materials-py/Cargo.toml
exclude = ["crates/navette-materials-py"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["opticsWolf"]
repository = "https://github.com/opticsWolf/Navette"

# Shared pins for the Python-facing crates (pure-Rust core may pin older
# toolchains independently).
[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
num-complex = "0.4"
rayon = "1"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
