[workspace]
resolver = "2"
members = [
  "crates/navette-color",
  "crates/navette-color-py",
  "crates/navette-interpolate",
  "crates/navette-interpolate-py",
  "crates/navette-smatrix",
  "crates/navette-smatrix-py",
  "crates/navette-spectralweave",
  "crates/navette-spectralweave-py",
  "crates/navette-materials",
  "crates/navette-materials-py",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["opticsWolf"]
repository = "https://github.com/opticsWolf/Navette"

# Shared pins for the Python-facing crates (pure-Rust core may pin older
# toolchains independently).
[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
num-complex = "0.4"
rayon = "1"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
