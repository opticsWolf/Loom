[workspace]
resolver = "2"
members = [
  "crates/navette-color",
  "crates/navette-interpolate",
  "crates/navette-smatrix",
  "crates/navette-structure",
  "crates/navette-spectralweave",
  "crates/navette-materials",
  "crates/navette",
  "crates/navette-py",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["opticsWolf"]
repository = "https://github.com/opticsWolf/Navette"

# Shared pins for the Python-facing crates (pure-Rust core may pin older
# toolchains independently).
[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
num-complex = "0.4"
rayon = "1"
ndarray = "0.15"
# Engine cores (version + path: resolvable on crates.io at publish time).
navette-color = { version = "0.4.0", path = "crates/navette-color" }
navette-interpolate = { version = "0.4.0", path = "crates/navette-interpolate" }
navette-materials = { version = "0.4.0", path = "crates/navette-materials" }
navette-smatrix = { version = "0.4.0", path = "crates/navette-smatrix" }
navette-structure = { version = "0.4.0", path = "crates/navette-structure" }
navette-spectralweave = { version = "0.4.0", path = "crates/navette-spectralweave" }
navette = { version = "0.4.0", path = "crates/navette" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
